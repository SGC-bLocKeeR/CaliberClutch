<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bg_purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B0F2A"/>
      <stop offset="100%" stop-color="#0B0512"/>
    </radialGradient>
    <filter id="glow_purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bg_purple)"/>
  <rect x="3" y="3" width="154" height="154" rx="29" fill="none" stroke="#A855F7" stroke-width="2" stroke-opacity="0.45"/>
