<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#180C2E"/>
      <stop offset="100%" stop-color="#080410"/>
    </radialGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bg5)"/>
  <rect x="3" y="3" width="154" height="154" rx="29" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Shield Contour -->
  <path d="M80 24 L120 40 V82 C120 108 102 128 80 136 C58 128 40 108 40 82 V40 Z" fill="#1F113D" stroke="#8B5CF6" stroke-width="3.5" filter="url(#glow5)"/>
  <!-- Star in Center -->
  <polygon points="80,48 85,64 102,64 88,74 94,90 80,80 66,90 72,74 58,64 75,64" fill="#FFFFFF"/>
  <circle cx="80" cy="70" r="3" fill="#8B5CF6"/>
  <!-- CC Monogram under star -->
  <text x="80" y="112" text-anchor="middle" fill="#8B5CF6" font-family="monospace" font-size="14" font-weight="900" letter-spacing="2">CC</text>
</svg>