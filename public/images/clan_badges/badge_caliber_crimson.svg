<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bg_crimson" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#240D10"/>
      <stop offset="100%" stop-color="#0D0405"/>
    </radialGradient>
    <filter id="glow_red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bg_crimson)"/>
  <rect x="3" y="3" width="154" height="154" rx="29" fill="none" stroke="#EF4444" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Combat Diamond Target -->
  <polygon points="80,16 142,74 80,132 18,74" fill="#180A0C" stroke="#EF4444" stroke-width="2" opacity="0.8" filter="url(#glow_red)"/>
  <circle cx="80" cy="74" r="42" fill="none" stroke="#F87171" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.6"/>
  <!-- Crosshair Blades -->
  <line x1="80" y1="22" x2="80" y2="36" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="112" x2="80" y2="126" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="74" x2="42" y2="74" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="74" x2="132" y2="74" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Caliber C Emblem in Crimson -->
  <path d="M102 54 H70 C56 54 46 63 46 74 C46 85 56 94 70 94 H102" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round" filter="url(#glow_red)"/>
  <polygon points="80,62 92,74 80,86 68,74" fill="#FFFFFF"/>
  <circle cx="80" cy="74" r="4" fill="#B91C1C"/>
  <!-- CaliberClutch Banner -->
  <rect x="22" y="128" width="116" height="18" rx="5" fill="#1C0A0D" stroke="#EF4444" stroke-width="1.2" stroke-opacity="0.7"/>
  <text x="80" y="141" text-anchor="middle" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" letter-spacing="2">CALIBER CLUTCH</text>
</svg>