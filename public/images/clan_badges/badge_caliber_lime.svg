<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182310"/>
      <stop offset="100%" stop-color="#080C05"/>
    </radialGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bg1)"/>
  <rect x="3" y="3" width="154" height="154" rx="29" fill="none" stroke="#A3E635" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Outer Crosshair Ring -->
  <circle cx="80" cy="80" r="55" fill="none" stroke="#A3E635" stroke-width="3" stroke-dasharray="14 6" opacity="0.8" filter="url(#glow1)"/>
  <circle cx="80" cy="80" r="42" fill="none" stroke="#A3E635" stroke-width="1.5" opacity="0.5"/>
  <!-- Crosshair marks -->
  <line x1="80" y1="16" x2="80" y2="32" stroke="#A3E635" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="128" x2="80" y2="144" stroke="#A3E635" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="80" x2="32" y2="80" stroke="#A3E635" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="80" x2="144" y2="80" stroke="#A3E635" stroke-width="3" stroke-linecap="round"/>
  <!-- Caliber C Monogram -->
  <path d="M104 56 H68 C52 56 40 68 40 80 C40 92 52 104 68 104 H104" fill="none" stroke="#A3E635" stroke-width="9" stroke-linecap="round" filter="url(#glow1)"/>
  <!-- Diamond center -->
  <polygon points="80,64 94,80 80,96 66,80" fill="#FFFFFF"/>
  <circle cx="80" cy="80" r="4.5" fill="#A3E635"/>
  <!-- Subtext -->
  <text x="80" y="132" text-anchor="middle" fill="#A3E635" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="3">CALIBER</text>
</svg>