<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bg_lime" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E0D"/>
      <stop offset="100%" stop-color="#070A05"/>
    </radialGradient>
    <filter id="glow_lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bg_lime)"/>
  <rect x="3" y="3" width="154" height="154" rx="29" fill="none" stroke="#A3E635" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Tactical Radar Rings -->
  <circle cx="80" cy="74" r="50" fill="none" stroke="#A3E635" stroke-width="2.5" stroke-dasharray="14 6" opacity="0.85" filter="url(#glow_lime)"/>
  <circle cx="80" cy="74" r="38" fill="none" stroke="#A3E635" stroke-width="1.2" opacity="0.4"/>
  <!-- Crosshair Hash Marks -->
  <line x1="80" y1="18" x2="80" y2="30" stroke="#A3E635" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="118" x2="80" y2="130" stroke="#A3E635" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="74" x2="36" y2="74" stroke="#A3E635" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="124" y1="74" x2="136" y2="74" stroke="#A3E635" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Caliber C Monogram -->
  <path d="M102 54 H70 C56 54 46 63 46 74 C46 85 56 94 70 94 H102" fill="none" stroke="#A3E635" stroke-width="8.5" stroke-linecap="round" filter="url(#glow_lime)"/>
  <!-- Clutch Diamond Core -->
  <polygon points="80,62 92,74 80,86 68,74" fill="#FFFFFF"/>
  <circle cx="80" cy="74" r="4" fill="#A3E635"/>
  <!-- Official CaliberClutch Name Banner -->
  <rect x="22" y="126" width="116" height="20" rx="6" fill="#141E0D" stroke="#A3E635" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="80" y="140" text-anchor="middle" fill="#A3E635" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" letter-spacing="2">CALIBER CLUTCH</text>
</svg>