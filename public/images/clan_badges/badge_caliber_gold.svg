<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bg_gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241B08"/>
      <stop offset="100%" stop-color="#0C0903"/>
    </radialGradient>
    <filter id="glow_gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bg_gold)"/>
  <rect x="3" y="3" width="154" height="154" rx="29" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Championship Shield Crest -->
  <path d="M80 16 L134 36 V86 C134 116 80 144 80 144 C80 144 26 116 26 86 V36 Z" fill="#1A1305" stroke="#F59E0B" stroke-width="2.5" opacity="0.85" filter="url(#glow_gold)"/>
  <!-- 3 Stars -->
  <polygon points="80,32 82.5,38 88.5,38 83.5,42 85.5,48 80,44.5 74.5,48 76.5,42 71.5,38 77.5,38" fill="#FBBF24"/>
  <polygon points="62,37 64,42 69,42 65,45.5 66.5,50 62,47 57.5,50 59,45.5 55,42 60,42" fill="#FBBF24" opacity="0.8"/>
  <polygon points="98,37 100,42 105,42 101,45.5 102.5,50 98,47 93.5,50 95,45.5 91,42 96,42" fill="#FBBF24" opacity="0.8"/>
  <!-- Caliber C Monogram in Gold -->
  <path d="M100 62 H72 C60 62 52 70 52 80 C52 90 60 98 72 98 H100" fill="none" stroke="#FBBF24" stroke-width="7.5" stroke-linecap="round" filter="url(#glow_gold)"/>
  <!-- Center Golden Diamond -->
  <polygon points="80,70 91,80 80,90 69,80" fill="#FFFFFF"/>
  <circle cx="80" cy="80" r="3.5" fill="#D97706"/>
  <!-- CaliberClutch Inscription -->
  <text x="80" y="126" text-anchor="middle" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" letter-spacing="2">CALIBER CLUTCH</text>
</svg>