<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bg_cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B1A28"/>
      <stop offset="100%" stop-color="#040912"/>
    </radialGradient>
    <filter id="glow_cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bg_cyan)"/>
  <!-- Tactical Hexagon Outline -->
  <polygon points="80,10 144,46 144,114 80,150 16,114 16,46" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.45"/>
  <polygon points="80,18 136,50 136,110 80,142 24,110 24,50" fill="#061826" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Inner Target Ring -->
  <circle cx="80" cy="74" r="38" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.7" filter="url(#glow_cyan)"/>
  <circle cx="80" cy="74" r="48" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <!-- Caliber C Winged Insignia -->
  <path d="M102 52 H68 C54 52 44 62 44 74 C44 86 54 96 68 96 H102" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" filter="url(#glow_cyan)"/>
  <polygon points="80,60 94,74 80,88 66,74" fill="#06B6D4"/>
  <polygon points="80,65 89,74 80,83 71,74" fill="#FFFFFF"/>
  <!-- Corner Tech Accents -->
  <line x1="80" y1="26" x2="80" y2="36" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="74" x2="52" y2="74" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
  <line x1="108" y1="74" x2="118" y2="74" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
  <!-- CaliberClutch Cyber Label -->
  <rect x="24" y="124" width="112" height="18" rx="5" fill="#061826" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.7"/>
  <text x="80" y="137" text-anchor="middle" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" letter-spacing="2">CALIBER CLUTCH</text>
</svg>