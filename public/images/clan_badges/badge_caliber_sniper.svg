<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#041A22"/>
      <stop offset="100%" stop-color="#020A0E"/>
    </radialGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bg4)"/>
  <rect x="3" y="3" width="154" height="154" rx="29" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Sniper Optic Rings -->
  <circle cx="80" cy="80" r="50" fill="none" stroke="#06B6D4" stroke-width="3" opacity="0.7" filter="url(#glow4)"/>
  <circle cx="80" cy="80" r="34" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.9"/>
  <circle cx="80" cy="80" r="18" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <!-- Reticle Hairlines -->
  <line x1="24" y1="80" x2="62" y2="80" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="98" y1="80" x2="136" y2="80" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="24" x2="80" y2="62" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="98" x2="80" y2="136" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center Bullet Pin -->
  <circle cx="80" cy="80" r="3" fill="#FFFFFF"/>
  <text x="80" y="132" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-size="9" font-weight="900" letter-spacing="3">128-TICK</text>
</svg>